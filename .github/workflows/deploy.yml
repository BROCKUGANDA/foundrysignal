name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS (self-hosted)
    runs-on: [self-hosted, linux]
    environment: production
    env:
      APP_DIR: /home/ubuntu/ai-azimara-foundrysignal
      SERVICE: foundrysignal
    steps:
      - uses: actions/checkout@v4
      # Pin the version that is already installed on the VPS. `latest` forces
      # setup-bun to re-download and copy the binary on every run, which fails
      # with ETXTBSY while other app processes have /home/ubuntu/.bun/bin/bun
      # mapped. Bump deliberately when a Bun upgrade is intended.
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.5" }

      - name: Materialize runtime env (from GitHub secrets)
        run: |
          umask 077
          {
            echo "NODE_ENV=production"
            echo "NEXT_TELEMETRY_DISABLED=1"
            echo "DATABASE_URL=${DATABASE_URL:?DATABASE_URL secret required}"
            echo "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}"
            echo "ALLOWED_ORIGINS=${ALLOWED_ORIGINS}"
            echo "TRUSTED_PROXIES=${TRUSTED_PROXIES}"
            echo "ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL}"
            echo "EMAIL_FROM=${EMAIL_FROM}"
            echo "RESEND_API_KEY=${RESEND_API_KEY}"
            echo "GITHUB_TOKEN=${COLLECTOR_GITHUB_TOKEN}"
            echo "SOLANA_RPC_URL=${SOLANA_RPC_URL}"
            echo "HELIUS_API_KEY=${HELIUS_API_KEY}"
            echo "PAYOUT_WALLET=${PAYOUT_WALLET}"
            echo "PAYOUT_WALLET_EVM=${PAYOUT_WALLET_EVM}"
            echo "USDC_MINT=${USDC_MINT}"
            echo "BILLING_PROVIDER=${BILLING_PROVIDER}"
            echo "TRADING_ENABLED=${TRADING_ENABLED}"
          } > "$RUNNER_TEMP/foundrysignal.env"
          sudo mkdir -p /etc/foundrysignal
          sudo mv "$RUNNER_TEMP/foundrysignal.env" /etc/foundrysignal/foundrysignal.env
          sudo chmod 600 /etc/foundrysignal/foundrysignal.env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          TRUSTED_PROXIES: ${{ secrets.TRUSTED_PROXIES }}
          ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          COLLECTOR_GITHUB_TOKEN: ${{ secrets.COLLECTOR_GITHUB_TOKEN }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          PAYOUT_WALLET: ${{ secrets.PAYOUT_WALLET }}
          PAYOUT_WALLET_EVM: ${{ secrets.PAYOUT_WALLET_EVM }}
          USDC_MINT: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
          BILLING_PROVIDER: ${{ secrets.BILLING_PROVIDER }}
          TRADING_ENABLED: "true"

      - name: Point the service at the env file (systemd drop-in, idempotent)
        run: |
          sudo mkdir -p /etc/systemd/system/${SERVICE}.service.d
          printf '[Service]\nEnvironmentFile=/etc/foundrysignal/foundrysignal.env\n' \
            | sudo tee /etc/systemd/system/${SERVICE}.service.d/env.conf >/dev/null
          sudo systemctl daemon-reload

      - name: Sync source
        run: |
          rsync -a --delete --exclude node_modules --exclude .next --exclude .git --exclude .env ./ "$APP_DIR/"
          cd "$APP_DIR" && bun install --frozen-lockfile

      - name: Apply database migrations
        working-directory: /home/ubuntu/ai-azimara-foundrysignal
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun x prisma migrate deploy

      - name: Generate Prisma client
        working-directory: /home/ubuntu/ai-azimara-foundrysignal
        run: bun x prisma generate

      - name: Build
        working-directory: /home/ubuntu/ai-azimara-foundrysignal
        run: bun run build

      - name: Restart service
        run: sudo systemctl restart ${SERVICE}

      - name: Health check
        run: |
          port=$(systemctl cat ${SERVICE} | grep -oP 'PORT=\K[0-9]+' | head -1); port=${port:-3000}
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/api/v1/health" >/dev/null 2>&1 || \
               curl -fsS "http://127.0.0.1:3000/api/v1/health" >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "health check failed"; sudo journalctl -u ${SERVICE} -n 50 --no-pager || true
            exit 1
          fi
          echo "healthy"

      - name: Billing readiness check
        run: |
          port=$(systemctl cat ${SERVICE} | grep -oP 'PORT=\K[0-9]+' | head -1); port=${port:-3000}
          status=$(curl -fsS "http://127.0.0.1:${port}/api/v1/pricing" || curl -fsS "http://127.0.0.1:3000/api/v1/pricing" || true)
          echo "$status" | head -c 400; echo
          echo "$status" | grep -q '"purchasingAvailable":true' || {
            echo "USDC checkout NOT configured — earning path is offline"; exit 1; }
