name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Auto-version & release
    runs-on: [self-hosted, linux]
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
          package-name: foundrysignal