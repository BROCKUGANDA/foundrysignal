<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="fs-appglyph-title">
  <title id="fs-appglyph-title">FoundrySignal application glyph</title>
  <!-- Application glyph — the emblem silhouette inverted out of a solid
       accent field, tuned for 16/32 px rendering. Strokes thicken by ~15%
       relative to the emblem so the signal node survives downscaling.

       Safe area: 2px on all sides. Minimum size 16px. -->
  <rect width="32" height="32" rx="8" fill="currentColor" />
  <g fill="var(--fs-bg, #080b12)">
    <rect x="7" y="5.5" width="3.4" height="21" rx="1.3" />
    <rect x="7" y="5.5" width="18.5" height="3.4" rx="1.3" />
    <rect x="7" y="13.4" width="14.8" height="3.4" rx="1.3" />
  </g>
  <g fill="none" stroke="var(--fs-bg, #080b12)" stroke-width="1.8" stroke-linecap="round" opacity="0.92">
    <path d="M25 8.6 L22.6 19.2" />
    <path d="M21.4 17.4 L21.8 19.2" />
  </g>
  <circle cx="22.8" cy="21" r="2.3" fill="var(--fs-bg, #080b12)" />
</svg>